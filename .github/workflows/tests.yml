name: tests

on:
  push:
  pull_request:

jobs:
  suite:
    name: 全量自测（Python ${{ matrix.python }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装前端无头验证依赖（jsdom）
        run: npm install --prefix _verify --no-audit --no-fund

      - name: 跑全量自测（jsdom 已预装，不再自动安装）
        run: python tests/run_all_tests.py --no-install

      - name: 上传自测产物（失败时排查用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboards-py${{ matrix.python }}
          path: |
            outputs/*.dashboard.html
            log/*.log
          if-no-files-found: ignore
