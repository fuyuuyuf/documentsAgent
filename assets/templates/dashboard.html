<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__PAGE_TITLE__</title>
<style>
  :root {
    color-scheme: light;
    --bg: #e9e6e0;
    --panel: #f5f3ee;
    --panel-2: #eeece6;
    --border: #bfc2be;
    --text: #1a1c1e;
    --text-dim: #626a70;
    --accent: #168b87;
    --accent-soft: #e0f3ef;
    --ok: #16865f;
    --warn: #a46035;
    --err: #b34340;
    --shadow: 0 14px 42px rgba(23, 40, 38, .14);
    --sans: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans CJK SC",
            "Source Han Sans SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b242d;
    --panel: #12313a;
    --panel-2: #193b44;
    --border: #31545b;
    --text: #f2f0e6;
    --text-dim: #adc0bf;
    --accent: #65d1c2;
    --accent-soft: #214b4a;
    --ok: #74d9ad;
    --warn: #efbd89;
    --err: #ffaaa0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1100px 760px at 76% 38%, #f2f0ea 0%, transparent 62%), var(--bg);
    color: var(--text); font-family: var(--sans);
    font-size: 14px; line-height: 1.6; overflow: hidden;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;          /* 顶栏 + 内容区，顶栏可换行时内容自适应 */
  }
  html[data-theme="dark"] body {
    background: radial-gradient(1100px 760px at 76% 38%, #173b44 0%, transparent 62%), var(--bg);
  }
  /* 主题切换时保留空间位置，只让界面颜色平滑过渡。 */
  body, .topbar, .tabs, .tab, .search, .search-suggestions, .btn, .icon-btn,
  .badge, .side, .side-head, .side-toggle, .side-body, .canvas-wrap,
  .legend, .brand-dock, .dock-toggle, .card, .paper-page, .ctx,
  .crit-card, .glossary-item, .guide-panel, .code-view, .node-tip {
    transition: background-color .3s ease, color .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  button, input, select { font-family: inherit; font-size: inherit; color: inherit; }

  /* ------------------------------------------------ 文本可选性：界面 chrome 不可选中，正文可复制 */
  .topbar, .canvas-wrap, .corner-dock, .legend, .side-head, .side-toggle, .export-menu {
    -webkit-user-select: none; user-select: none;
  }
  .topbar input, .side-body, .side-body *,
  .code-view, .scroll-view, .scroll-view * {
    -webkit-user-select: text; user-select: text;
  }

  /* ---------------------------------------------------------------- 顶栏（单行：标签页 + 搜索 + 统计 + 工具 + 导出/主题/打印）
     标题块已移至画布左下角悬浮卡（.corner-dock），顶栏只保留操作项，1280px 及以上保持单行 */
  .topbar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px;
    padding: 6px 12px; min-height: 42px; flex: 0 0 auto;
    background: color-mix(in srgb, var(--panel) 84%, transparent); border-bottom: 1px solid var(--border);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .brand-mark {
    width: 24px; height: 24px; border-radius: 7px; flex: 0 0 auto;
    background: var(--text);
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px;
  }
  .spacer { flex: 1 1 auto; }
  .search {
    display: flex; align-items: center; gap: 6px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 4px 9px; width: 180px; flex: 0 0 auto;
    position: relative;
  }
  .search input { border: 0; background: transparent; outline: none; width: 100%; min-width: 0; }
  .search input::placeholder { color: var(--text-dim); opacity: 1; }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search-suggestions {
    position: absolute; top: calc(100% + 7px); left: 0; z-index: 70;
    width: min(320px, calc(100vw - 24px)); max-height: min(360px, 60vh); overflow-y: auto;
    padding: 5px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow);
  }
  .search-suggestions[hidden] { display: none; }
  .search-suggestions button, .search-suggestions [role="option"] {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; border: 0; border-radius: 7px; padding: 7px 9px;
    background: transparent; color: var(--text); text-align: left; cursor: pointer;
  }
  .search-suggestions button:hover, .search-suggestions button.active,
  .search-suggestions [role="option"]:hover, .search-suggestions [aria-selected="true"] {
    background: var(--accent-soft); color: var(--accent);
  }
  .search-suggestions .search-suggestion:focus-visible {
    outline: 2px solid var(--accent); outline-offset: -2px;
  }
  .search-suggestions .suggestion-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .search-suggestions .suggestion-kind { order: 2; flex: none; color: var(--text-dim); font-size: 11px; }
  .search-suggestions .suggestion-meta { color: var(--text-dim); font-size: 11px; white-space: nowrap; }
  .search-suggestions .suggestion-empty { padding: 8px 9px; color: var(--text-dim); font-size: 12px; }
  .ui-icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab, .topbar > .btn, .topbar .search, #btnExport { display: inline-flex; align-items: center; gap: 6px; }
  .topbar > .btn.icon-action { justify-content: center; min-width: 32px; padding: 5px 7px; }
  #btnTheme .theme-sun { display: none; }
  html[data-theme="dark"] #btnTheme .theme-moon { display: none; }
  html[data-theme="dark"] #btnTheme .theme-sun { display: block; }
  .btn {
    border: 1px solid var(--border); background: var(--panel-2); border-radius: 8px;
    padding: 5px 10px; cursor: pointer; white-space: nowrap; font-size: 13px;
    transition: background .15s, border-color .15s, transform .05s;
  }
  .btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--text); border-color: var(--text); color: var(--panel); }
  html[data-theme="dark"] .btn.primary { color: #0b242d; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
    font-size: 12px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text-dim);
    white-space: nowrap;
  }
  .badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--border)); }
  .badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--border)); }
  .badge.err { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, var(--border)); }

  /* 顶栏内的分组工具 */
  .tool-group {
    display: flex; align-items: center; gap: 4px; flex: 0 0 auto;
    padding: 2px 6px; border-left: 1px solid var(--border);
  }
  .zoom-label { font-size: 12px; color: var(--text-dim); min-width: 38px; text-align: center; }
  .icon-btn {
    width: 28px; height: 28px; display: grid; place-items: center; padding: 0;
    border: 1px solid var(--border); background: var(--panel-2); border-radius: 7px; cursor: pointer;
    font-size: 14px; line-height: 1;
  }
  .icon-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  /* 键盘可达性：所有可聚焦控件都有可见焦点环（Tab 遍历顶栏工具 / 图例 / 菜单项） */
  .btn:focus-visible, .icon-btn:focus-visible, .tab:focus-visible, .menu-item:focus-visible,
  .side-toggle:focus-visible, .dock-toggle:focus-visible, .legend .item:focus-visible,
  .glossary-item:focus-visible, .search:focus-within {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  /* 导图专属工具在其它视图下隐藏 */
  body:not([data-view="map"]) .map-only { display: none; }

  /* 导出下拉 */
  .export-wrap { position: relative; flex: 0 0 auto; }
  .export-menu {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 60; min-width: 158px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow); padding: 4px;
  }
  .export-menu[hidden] { display: none; }
  .menu-item {
    display: block; width: 100%; text-align: left; border: 0; background: transparent;
    padding: 7px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; font-size: 13px;
  }
  .menu-item:hover { background: var(--accent-soft); }

  /* 顶栏内的视图标签（分段式） */
  .tabs {
    display: flex; gap: 2px; padding: 2px; flex: 0 0 auto; overflow-x: auto; max-width: 100%;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px;
  }
  .tab {
    border: 0; background: transparent; padding: 4px 10px; border-radius: 6px;
    cursor: pointer; color: var(--text-dim); white-space: nowrap; font-size: 13px;
  }
  .tab:hover { color: var(--text); background: var(--accent-soft); }
  .tab.active {
    color: var(--accent); background: var(--accent-soft);
    font-weight: 600; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
  }

  /* ---------------------------------------------------------------- 布局 */
  .layout { display: flex; flex: 1 1 auto; min-height: 0; }
  .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .side {
    flex: 0 0 380px; width: 380px; border-left: 1px solid var(--border);
    background: color-mix(in srgb, var(--panel) 90%, transparent);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    display: flex; flex-direction: column; min-height: 0;
    transition: flex-basis .18s ease, width .18s ease;
  }
  .layout.side-collapsed .side {
    flex-basis: 0; width: 0; min-width: 0; border-left-color: transparent; overflow: hidden;
  }

  /* 详情面板收起 / 展开开关（贴主区右缘的箭头） */
  .side-toggle {
    position: absolute; top: 50%; right: 0; transform: translateY(-50%); z-index: 30;
    width: 20px; height: 56px; padding: 0;
    border: 1px solid var(--border); border-right: 0; border-radius: 8px 0 0 8px;
    background: var(--panel); color: var(--text-dim); cursor: pointer;
    font-size: 12px; line-height: 1; display: grid; place-items: center;
    box-shadow: -2px 0 8px rgba(22, 64, 65, .08);
  }
  .side-toggle:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  html[data-theme="dark"] .side-toggle { box-shadow: -2px 0 8px rgba(0, 0, 0, .3); }

  /* ---------------------------------------------------------------- 画布 */
  .canvas-wrap {
    position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden;
    background: radial-gradient(900px 600px at 82% 28%, color-mix(in srgb, var(--panel) 76%, transparent), transparent 70%), var(--bg);
    cursor: grab;
  }
  .canvas-wrap.dragging { cursor: grabbing; }
  .canvas {
    position: absolute; z-index: 1; top: 0; left: 0; transform-origin: 0 0;
    padding: 28px;
  }
  /* 不常驻合成图层：缩放后让浏览器按新的比例重绘 SVG 文字与边框。 */
  .canvas .mermaid-host svg { max-width: none !important; height: auto; overflow: visible;
    shape-rendering: geometricPrecision; text-rendering: geometricPrecision; }
  .canvas .mermaid-host svg text, .canvas .mermaid-host svg foreignObject {
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .canvas .mermaid-host svg .node rect, .canvas .mermaid-host svg .node path,
  .canvas .mermaid-host svg .node polygon, .canvas .mermaid-host svg .node circle,
  .canvas .mermaid-host svg .cluster rect {
    vector-effect: non-scaling-stroke;
  }
  /* 两套配色直接作用于现有 SVG；切换主题时不重新执行 Mermaid 布局。 */
  .canvas-wrap {
    --map-cluster: #f5f3ee; --map-cluster-border: #9fa9a6;
    --map-cluster-text: #1a1c1e; --map-edge-label: #e9e6e0;
    --map-edge-text: #263d40; --map-line: #405b5a;
    --map-node: #e0f3ef; --map-node-border: #6ca9a3; --map-node-text: #1a1c1e;
  }
  html[data-theme="dark"] .canvas-wrap {
    --map-cluster: #173b44; --map-cluster-border: #3a6970;
    --map-cluster-text: #ddf0e9; --map-edge-label: #12313a;
    --map-edge-text: #e0f3ef; --map-line: #b1d5d0;
    --map-node: #19414a; --map-node-border: #5b999b; --map-node-text: #eef7f4;
  }
  .canvas .cluster rect {
    fill: var(--map-cluster) !important; stroke: var(--map-cluster-border) !important;
    transition: fill .3s ease, stroke .3s ease, opacity .15s;
  }
  .canvas .cluster-label, .canvas .cluster-label span, .canvas .cluster-label p,
  .canvas .cluster-label text { color: var(--map-cluster-text) !important; fill: var(--map-cluster-text) !important; }
  .canvas .edgeLabel rect, .canvas .edgeLabel .labelBkg {
    fill: var(--map-edge-label) !important; transition: fill .3s ease;
  }
  .canvas .edgeLabel, .canvas .edgeLabel span, .canvas .edgeLabel p,
  .canvas .edgeLabel text { color: var(--map-edge-text) !important; fill: var(--map-edge-text) !important; }
  .canvas .flowchart-link { stroke: var(--map-line) !important; stroke-width: 2.8px !important;
    vector-effect: non-scaling-stroke; opacity: 1; transition: stroke .3s ease, opacity .15s; }
  .canvas .edgePath path { stroke: var(--map-line) !important; stroke-width: 2.8px !important;
    vector-effect: non-scaling-stroke; }
  .canvas marker path { fill: var(--map-line) !important; stroke: var(--map-line) !important; }
  /* 节点本体（框内填充 / 描边 / 文字）：Mermaid 渲染时按渲染时主题烘焙成内联属性，
     必须用变量覆盖，否则切换深浅色时只有分区框和连线变色，节点框内颜色纹丝不动。
     放在 .hit / .selected 规则之前：后两者特异性更高，搜索与选中高亮不受影响。 */
  .canvas .node rect, .canvas .node circle, .canvas .node polygon, .canvas .node path {
    fill: var(--map-node) !important; stroke: var(--map-node-border) !important;
    transition: fill .3s ease, stroke .3s ease;
  }
  .canvas .node .nodeLabel, .canvas .node span, .canvas .node p,
  .canvas .node text { color: var(--map-node-text) !important; fill: var(--map-node-text) !important; }

  /* 节点交互 */
  .canvas .node { cursor: pointer; transition: opacity .15s; }
  .canvas .node rect, .canvas .node circle, .canvas .node polygon, .canvas .node path {
    transition: filter .15s, stroke-width .15s;
  }
  .canvas .node:hover rect, .canvas .node:hover circle,
  .canvas .node:hover polygon, .canvas .node:hover path {
    filter: brightness(1.12) drop-shadow(0 2px 6px rgba(22, 139, 135, .34));
  }
  .canvas .node.dim { opacity: .18; }
  .canvas .node.hit rect, .canvas .node.hit circle,
  .canvas .node.hit polygon, .canvas .node.hit path {
    stroke: #f59e0b !important; stroke-width: 3px !important;
    filter: drop-shadow(0 0 8px rgba(245, 158, 11, .8));
  }
  .canvas .node.selected rect, .canvas .node.selected circle,
  .canvas .node.selected polygon, .canvas .node.selected path {
    stroke: #ef4444 !important; stroke-width: 3px !important;
  }
  .canvas .edgePath path, .canvas .flowchart-link { transition: opacity .15s, stroke .3s ease; }
  .canvas .edgePath.dim path, .canvas .flowchart-link.dim { opacity: .28; }
  .canvas .cluster rect { transition: opacity .15s, fill .3s ease, stroke .3s ease; }
  /* 分区显隐（2a 性能优化）：图例 / 主干模式隐藏分区时只切 .sec-hidden 类，
     不重建 SVG —— cluster 背景、其所属节点与两端涉及被隐藏分区的连线/边标签一并隐去。 */
  .canvas .sec-hidden { display: none; }

  /* ---------------------------------------------------------------- 节点悬停提示 */
  .node-tip {
    position: absolute; left: 0; top: 0; z-index: 40; max-width: 320px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 9px;
    box-shadow: var(--shadow); padding: 8px 10px;
    font-size: 12px; line-height: 1.55; pointer-events: none;
    opacity: 0; visibility: hidden; transition: opacity .12s;
  }
  .node-tip.show { opacity: 1; visibility: visible; }
  .node-tip .tip-label { font-weight: 650; font-size: 12.5px; margin-bottom: 2px; word-break: break-word; }
  .node-tip .tip-detail { color: var(--text); word-break: break-word; }
  .node-tip .tip-detail.empty { color: var(--text-dim); }
  .node-tip .tip-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 5px; color: var(--text-dim); }
  .node-tip .tip-meta .tip-state.ok { color: var(--ok); }
  .node-tip .tip-meta .tip-state.warn { color: var(--warn); }
  .node-tip .tip-meta .tip-state.err { color: var(--err); }

  /* ---------------------------------------------------------------- 左下角悬浮信息卡组（图例 + 标题徽章，可折叠）
     卡片容器 pointer-events: none —— 非交互部分完全不挡画布拖动；
     图例项、折叠按钮与标题徽章（.brand-dock）单独恢复 pointer-events: auto，
     否则标题徽章悬停不出原生 title 提示（父容器 pointer-events:none 会连带拦截）。 */
  .corner-dock {
    position: absolute; left: 12px; bottom: 12px; z-index: 5;
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    max-width: 340px; pointer-events: none;
  }
  .dock-body { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; max-width: 100%; }
  .corner-dock[data-collapsed="true"] .dock-body { display: none; }
  .dock-toggle {
    pointer-events: auto; display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text-dim);
    border-radius: 999px; padding: 3px 10px; font-size: 11.5px; cursor: pointer;
    box-shadow: var(--shadow); -webkit-user-select: none; user-select: none;
  }
  .dock-toggle:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  /* 图例（分区显隐）：卡片背景穿透，仅色块项可点击 */
  .legend {
    background: color-mix(in srgb, var(--panel) 84%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 8px 10px; box-shadow: var(--shadow); max-width: 100%;
    display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px;
    pointer-events: none;
  }
  .legend .item {
    display: flex; align-items: center; gap: 5px; cursor: pointer; pointer-events: auto;
    -webkit-user-select: none; user-select: none;
  }
  .legend .item.off { opacity: .35; }
  .legend .dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }

  /* 标题徽章（自顶栏迁入：论字 logo + 论文标题 + 元信息小字） */
  .brand-dock {
    display: flex; align-items: center; gap: 8px; max-width: 100%;
    background: color-mix(in srgb, var(--panel) 84%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 6px 10px; box-shadow: var(--shadow);
    pointer-events: auto;   /* 恢复悬停：超长标题截断时靠原生 title 看全文 */
  }
  .brand-dock .brand-text { min-width: 0; line-height: 1.35; }
  .brand-dock .brand-title {
    font-weight: 650; font-size: 12.5px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 300px;
  }
  .brand-dock .brand-sub {
    font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 300px;
  }

  /* ---------------------------------------------------------------- 右侧面板 */
  .side-head {
    padding: 12px 16px; border-bottom: 1px solid var(--border); flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
  }
  .side-head h2 { margin: 0; font-size: 14px; font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-body { flex: 1 1 auto; overflow-y: auto; padding: 14px 16px 40px; min-height: 0; }
  .side-body::-webkit-scrollbar { width: 9px; }
  .side-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

  .hint {
    padding: 12px 14px; border: 1px dashed var(--border); border-radius: 10px;
    color: var(--text-dim); font-size: 13px; background: var(--panel-2);
  }
  .field { margin-bottom: 16px; }
  .field-label {
    font-size: 12px; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: .04em; margin-bottom: 4px; font-weight: 600;
  }
  .field-value { word-break: break-word; }
  .field-value.quote {
    border-left: 3px solid var(--accent); background: var(--accent-soft);
    padding: 8px 10px; border-radius: 0 8px 8px 0; font-size: 13px;
  }
  .field-value.quote.en { font-style: italic; }

  .guide-backdrop {

  .spinner {

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 1280px) {

  /* 无障碍（1c）：用户系统偏好「减少动态效果」时，禁用全部过渡与动画（含加载转圈静止化） */
  @media (prefers-reduced-motion: reduce) {

<script>
  /* 首帧主题预置（1d）：在任何绘制发生前读取本地偏好并落 data-theme，
     避免深色用户先看到浅色再翻黑（app.js 内的恢复逻辑与此保持幂等一致）。 */
  try {
    var __preferredTheme = window.localStorage.getItem('paper-theme');
    if (__preferredTheme === 'dark' || __preferredTheme === 'light') {
      document.documentElement.setAttribute('data-theme', __preferredTheme);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch (e) { /* 隐私模式 / 本地文件禁用存储时保持默认浅色 */ }
</script>
